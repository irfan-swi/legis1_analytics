<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobbying Firm Revenue Analysis</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Filter Panel -->
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">Year</label>
                    <select id="yearFilter">
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Firms Shown</label>
                    <select id="topNFilter">
                        <option value="10">10 Firms</option>
                        <option value="25" selected>25 Firms</option>
                        <option value="50">50 Firms</option>
                        <option value="100">100 Firms</option>
                        <option value="all">All Firms</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Min Revenue</label>
                    <input type="number" id="minRevenueFilter" placeholder="$0" min="0" step="100000">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Revenue</label>
                    <input type="number" id="maxRevenueFilter" placeholder="No limit" min="0" step="100000">
                </div>
                <div class="filter-group search-group">
                    <label class="filter-label">Search Firm</label>
                    <div class="search-wrapper">
                        <input type="text" id="firmSearch" placeholder="Type to search...">
                        <div class="autocomplete-dropdown" id="autocomplete"></div>
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Min Lobbyists</label>
                    <input type="number" id="minLobbyistsFilter" placeholder="0" min="0" value="10">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Lobbyists</label>
                    <input type="number" id="maxLobbyistsFilter" placeholder="No limit" min="0">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Lobbying Type</label>
                    <select id="lobbyingTypeFilter">
                        <option value="all">All Lobbying</option>
                        <option value="exclude-in-house" selected>Exclude In-House</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">View Type</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" id="barBtn">Bar</button>
                        <button class="toggle-btn" id="lineBtn">Line</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Chart Section -->
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title" id="chartTitle">Revenue per Active Lobbyist Rankings</div>
                    <div class="chart-subtitle" id="chartSubtitle">Loading data...</div>
                </div>
                <div class="chart-content">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- Detail Panel -->
            <div class="detail-panel">
                <div id="firmDetails">
                    <div class="detail-header">
                        <div class="detail-title">Firm Overview</div>
                        <div class="detail-subtitle">Click on a firm for details</div>
                    </div>
                    <div class="no-selection">
                        Select a firm from the chart to view detailed information
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

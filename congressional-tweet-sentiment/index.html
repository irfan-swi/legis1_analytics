<!DOCTYPE html>
<html>
<head>
    <title>Congressional Tweet Sentiment</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Congressional Tweet Sentiment</h1>
    <label for="viewToggle">Show Sentiment Spread</label>
    <input type="checkbox" id="viewToggle">
    <div id="chart"></div>
    <script>
        const viewToggle = document.getElementById('viewToggle');

            function updateChart(data) {
                if (viewToggle.checked) {
                    let spread = data['Republican'].y.map((y, i) => y - data['Democrat'].y[i]);
                    let trace = {
                        x: data['Republican'].x,
                        y: spread,
                        type: 'scatter',
                        name: 'Sentiment Spread (R - D)'
                    };
                    Plotly.newPlot('chart', [trace]);
                } else {
                    let traces = Object.keys(data).map(party => {
                        return {
                            x: data[party].x,
                            y: data[party].y,
                            name: party,
                            type: 'scatter'
                        };
                    });
                    Plotly.newPlot('chart', traces);
                }
            }

            viewToggle.addEventListener('change', () => updateChart(window.chartData));

        fetch('/data')
            .then(response => response.json())
            .then(data => {
                window.chartData = data;
                updateChart(data);
            });
    </script>
</body>
</html>
